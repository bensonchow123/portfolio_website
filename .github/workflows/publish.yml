name: Publish image

# Builds the site image and pushes it to ghcr.io, so small servers can pull instead of building.
#
# Only runs on a version tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.2.3, not v1.2 or v1.2.3-beta
  workflow_dispatch: # manual run, tags the result by commit sha only

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # what lets GITHUB_TOKEN push to ghcr

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # no PAT needed for the repo's own packages

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest, so the server can pin however
          # loosely it wants. A manual run only gets the sha tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64 # my vps is x86_64, so no emulated arm64 build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run reinstalls the whole dependency layer
          cache-from: type=gha
          cache-to: type=gha,mode=max
