# Local development with live reload and a CSS watcher.
services:
  web:
    # Includes the tools needed for live reload and PDF generation.
    build:
      context: .
      target: dev
    image: portfolio_web:dev
    # Match the host user so bind mounted files stay writable.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # No proxy in development.
      - PROXY_FIX_HOPS=0
      # Host networking, so this is the host's loopback for connecting to the vault.
      - DEV_HOST=127.0.0.1
      # The vault publishes 8000 on the same loopback.
      - SCROBBLE_VAULT_URL=${SCROBBLE_VAULT_URL:-http://127.0.0.1:8000}
    # Share the host's network stack, so loopback is the one loopback.
    # App and livereload listen on 5500 directly, no port mapping needed.
    network_mode: host
    command: ["sh", "-c", "python -m scripts.build_pdf && python app.py"]
    volumes:
      # Mount the source so edits appear without rebuilding.
      - .:/app

  # Rebuild CSS when source files change.
  css:
    build:
      context: .
      target: css
    image: portfolio_css:dev
    command: ["npm", "run", "watch:css"]
    # Keep generated CSS owned by the host user.
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    volumes:
      # CSS inputs and output.
      - ./assets:/app/assets
      - ./templates:/app/templates
      - ./static/js:/app/static/js
      - ./static/css:/app/static/css
